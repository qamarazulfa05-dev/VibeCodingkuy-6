<!DOCTYPE html>
<html lang="id">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Sistem Peminjaman Buku</title>

    <link rel="stylesheet" href="style.css">
</head>

<body>

    <!-- ==============================
         HALAMAN LOGIN
    =============================== -->

    <div id="loginPage" class="login-container">

        <div class="login-card">

            <h1>Sistem Peminjaman Buku</h1>

            <p class="login-description">
                Silakan login untuk melihat dan meminjam buku.
            </p>

            <label for="nimMahasiswa">
                NIM
            </label>

            <input
                type="text"
                id="nimMahasiswa"
                placeholder="Masukkan NIM"
                inputmode="numeric"
                autocomplete="username"
                maxlength="20"
            >

            <label for="passwordMahasiswa">
                Password
            </label>

            <input
                type="password"
                id="passwordMahasiswa"
                placeholder="Masukkan password"
                autocomplete="current-password"
            >

            <button
                type="button"
                id="loginButton"
                class="login-button"
            >
                Login
            </button>

            <p
                id="loginError"
                class="error-message"
            ></p>

            <p class="service-status">
                API: <span id="apiStatus">memeriksa...</span>
            </p>

        </div>

    </div>


    <!-- ==============================
         HALAMAN UTAMA
    =============================== -->

    <div id="mainPage" class="main-container hidden">

        <!-- HEADER -->

        <header class="header">

            <div class="header-info">

                <h1>Sistem Peminjaman Buku</h1>
                <p class="student-info">
                    NIM:
                    <strong id="nimUser"></strong>
                </p>

            </div>


            <div class="header-buttons">

                <button
                    type="button"
                    id="restartButton"
                    class="restart-button"
                >
                    Restart Sistem
                </button>

                <button
                    type="button"
                    id="logoutButton"
                    class="logout-button"
                >
                    Logout
                </button>

            </div>

        </header>


        <!-- ==============================
             DAFTAR BUKU
        =============================== -->

        <section class="content-card">

            <h2>Daftar Buku</h2>

            <div
                id="bookList"
                class="book-list"
            >
            </div>

        </section>


        <!-- ==============================
             INFORMASI PEMINJAMAN
        =============================== -->

        <section class="content-card">

            <h2>Informasi Peminjaman</h2>

            <div id="loanInformation">

                <p class="empty-loan">
                    Belum ada buku yang dipinjam.
                </p>

            </div>

        </section>

    </div>


    <script src="config.js"></script>
    <script src="script.js"></script>

</body>

</html>
